[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "intanalyze"
dynamic = ["version"]
description = "Checks whether a published npm package matches its source repository."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Maryada Sharath Chandra Reddy" },
  { name = "Sugunesh Dande" },
  { name = "Adem Aravind" },
  { name = "BBSVS Praveen" },
]
keywords = ["supply-chain", "security", "npm", "integrity"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "pydantic>=2.6",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
]

[project.scripts]
intanalyze = "intanalyze.cli:app"

[tool.hatch.version]
path = "src/intanalyze/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/intanalyze"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as call defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: test needs the real npm registry / GitHub (skipped by default)"]

[tool.coverage.run]
source = ["intanalyze"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
